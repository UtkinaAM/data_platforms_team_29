server {
    listen 8088;
    server_name _;
    location / {
        proxy_pass http://team-29-nn:8088;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

